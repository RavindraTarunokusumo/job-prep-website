repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        # web/ uses Next/shadcn formatting; format via web/ package when added
        files: ^(?!web/).*\.(ts|tsx|js|jsx|json|md|css|scss)$

  - repo: local
    hooks:
      - id: eslint-web
        name: ESLint (web)
        entry: bash -c 'cd web && npx eslint --fix .'
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: prisma-format
        name: Prisma Format
        entry: bash -c 'cd web && npx prisma format'
        language: system
        files: web/prisma/schema\.prisma
        pass_filenames: false

      - id: typecheck
        name: TypeScript Type Check
        entry: bash -c 'cd web && npx tsc --noEmit'
        language: system
        files: web/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [push]

ci:
  autofix_commit_msg: "chore: auto fixes from pre-commit hooks"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
